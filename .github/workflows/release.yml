name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/solar-${os}-${arch}"
            [ "$os" = windows ] && out="${out}.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/wetakush/solaragent/internal/app.Version=${VERSION}" -o "$out" .
          done
          cd dist && sha256sum solar-* > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "SolarAgent $GITHUB_REF_NAME" --generate-notes
